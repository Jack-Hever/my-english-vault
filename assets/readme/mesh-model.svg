<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Two independent relationship systems</title>
  <desc id="d">Vertical is-a/meronymy tree (green) and horizontal synonym-peer group (blue) are stored in two separate data models; antonyms (red) attach orthogonally.</desc>

  <rect width="1200" height="440" fill="#ffffff"/>

  <g transform="translate(60 56)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="1.5" fill="#787c72">WHY IT'S DIFFERENT</text>
    <text x="0" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="38" font-weight="700" fill="#1f211d">One word, two independent</text>
    <text x="0" y="92" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="38" font-weight="700" fill="#1f211d">relationship systems</text>
  </g>

  <g transform="translate(80 180)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="22" font-weight="700" fill="#2f855a">&#32489;&#21521; &#183; &#20174;&#23646;&#23618;&#32423;</text>
    <text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#787c72">Is-a / meronymy — a directed tree</text>

    <line x1="140" y1="90" x2="70" y2="170" stroke="#2f855a" stroke-width="3"/>
    <line x1="140" y1="90" x2="230" y2="170" stroke="#2f855a" stroke-width="3"/>
    <circle cx="140" cy="60" r="30" fill="#2f855a"/>
    <text x="140" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">A</text>
    <circle cx="60" cy="200" r="26" fill="#2f855a"/>
    <text x="60" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">B</text>
    <circle cx="220" cy="200" r="26" fill="#2f855a"/>
    <text x="220" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">C</text>
  </g>

  <g transform="translate(680 180)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="22" font-weight="700" fill="#2f6fd0">&#27178;&#21521; &#183; &#36817;&#20041;&#21516;&#20237;</text>
    <text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#787c72">Synonym peers — an undirected group</text>

    <line x1="68" y1="130" x2="172" y2="130" stroke="#2f6fd0" stroke-width="3"/>
    <line x1="208" y1="130" x2="312" y2="130" stroke="#2f6fd0" stroke-width="3"/>
    <circle cx="40" cy="130" r="28" fill="#2f6fd0"/>
    <text x="40" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">X</text>
    <circle cx="200" cy="130" r="28" fill="#2f6fd0"/>
    <text x="200" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Y</text>
    <circle cx="360" cy="130" r="28" fill="#2f6fd0"/>
    <text x="360" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Z</text>

    <line x1="200" y1="158" x2="200" y2="168" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="200" cy="192" r="24" fill="#c0392b"/>
    <text x="200" y="198" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" font-weight="700" fill="#ffffff">ant</text>
    <text x="200" y="230" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#c0392b">&#21453;&#20041; antonym</text>
  </g>


  <text x="600" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#45483f">Two separate data models. They never merge into one table.</text>
</svg>
